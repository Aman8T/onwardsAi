[project]
name = "tayyari-backend"
version = "0.2.0"
description = "Tayyari API on FastAPI: resume and link analysis, skill graph synthesis, Jev decisions and career chat."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.116",
    "anthropic>=1.11",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "structlog>=24.4",
    "platformdirs>=4.3",
    "pypdf>=5",
    "python-docx>=1.1",
    "httpx2>=2.13.1",
    "authlib>=1.8.0",
    "reportlab>=5.0.1",
    "stripe>=16.0.0",
]

# Deliberately no [build-system]: FastAPI Cloud installs the locked dependencies from uv.lock and
# imports the flat `tayyari/` package that sits next to main.py; the project itself is never installed
# (so there are no [project.scripts] either: use `uv run python -m tayyari.cli ...`).

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "asgi-lifespan>=2.1",
    "ruff>=0.7",
    "mypy>=1.13",
]

# Names the app explicitly for `fastapi dev`, `fastapi run` and FastAPI Cloud (needs
# fastapi-cli >= 0.0.16, which `fastapi[standard]` pulls in). Auto-discovery would also
# find main.py:app, but the explicit entrypoint cannot drift if another candidate
# module is ever added next to it.
[tool.fastapi]
entrypoint = "main:app"

# ───────────────────────────── ruff ─────────────────────────────

[tool.ruff]
line-length = 110
target-version = "py312"
# The deployed app is kept byte-for-byte until the new one replaces it (Wave 4 deletes the folder).
extend-exclude = ["tayyari/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF", "PT", "N", "S", "T20"]
ignore = [
    "E501",    # the formatter owns line length; long strings and URLs are fine
    "B008",    # FastAPI's Depends()/Query() in argument defaults
    "RUF001",  # the UI copy uses typographic characters on purpose (… · ’ “ ”)
    "RUF002",
    "RUF003",
    "S311",    # random is used for jitter and pacing, never for secrets (those use `secrets`)
    "N818",    # AppError subclasses are named after the HTTP condition (NotFound, RateLimited), not ...Error
    "SIM105",  # try/except/pass reads better than contextlib.suppress in error paths
    "PT011",   # pytest.raises(ValueError) without match is fine in unit tests
]

[tool.ruff.lint.isort]
known-first-party = ["tayyari"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts and prints are normal, hard-coded secrets/ids are fixtures, and compound asserts, nested
# `with` blocks and constant-first comparisons read fine in test code.
"tests/**" = ["S101", "S105", "S106", "S108", "T20", "PT012", "PT018", "SIM117", "SIM300"]
# The CLI is the one place that prints to the terminal, runs subprocesses (npm, uvx) by name and may bind
# a server to an explicit host the developer chose.
"tayyari/cli/**" = ["T20", "S603", "S607", "S104"]
# ingest/ and sample/ are moved-as-is code (Wave 1 cleans them up): keep the gate on real errors only.
"tayyari/ingest/**" = ["T20", "S", "SIM", "B", "RUF", "N", "ASYNC", "PT", "UP"]
"tayyari/sample/**" = ["T20", "S", "SIM", "B", "RUF", "N", "ASYNC", "PT", "UP"]

[tool.ruff.format]
quote-style = "double"
# Moved-as-is code keeps its hand-wrapped layout until its cleanup unit runs `ruff format` over it
# (Wave 1, ingest cleanup); then delete this line so the whole tree is held to the formatter.
exclude = ["tayyari/sample/**"]

# ───────────────────────────── mypy ─────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["tayyari"]
show_error_codes = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# The deployed app: not type-checked until it is deleted.
[[tool.mypy.overrides]]
module = ["tayyari.legacy", "tayyari.legacy.*"]
ignore_errors = true

# Moved-as-is packages: relaxed until their cleanup unit types them.
[[tool.mypy.overrides]]
module = ["tayyari.ingest", "tayyari.ingest.*", "tayyari.sample", "tayyari.sample.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_return_any = false
check_untyped_defs = false

# asyncpg ships no type information; logfire is an optional extra that is never installed by default.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "logfire", "logfire.*"]
ignore_missing_imports = true

# ───────────────────────────── pytest ─────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# importlib mode: every unit adds test files under tests/unit/<area>/ and two areas may both have a
# test_models.py; this keeps their module names apart without __init__.py files in each folder.
addopts = "-q --import-mode=importlib"

[tool.coverage.run]
source = ["tayyari"]
omit = ["tayyari/legacy/*"]
