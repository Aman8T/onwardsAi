<!DOCTYPE html>
<html><head><title>Acme - Platform Engineer</title><meta property="og:title" content="Acme - Platform Engineer"></head>
<body><div class="posting-headline"><h2>Platform Engineer</h2><div class="posting-categories"><div class="sort-by-location posting-category location">Remote, India</div></div></div>
<form id="application-form" class="application-form" method="POST" enctype="multipart/form-data" action="https://jobs.lever.co/acme/0f8f8b3c-1d2e-4c5b-9a7f-123456789abc/apply">
  <ul>
  <li class="application-question resume"><label for="resume-upload-input"><div class="application-label">Resume/CV<span class="required">✱</span></div></label><input type="file" name="resume" id="resume-upload-input" class="application-file-input" required></li>
  <li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div><div class="application-field"><input type="text" name="name" required></div></label></li>
  <li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div><div class="application-field"><input type="email" name="email" required></div></label></li>
  <li class="application-question"><label><div class="application-label">Phone</div><div class="application-field"><input type="text" name="phone"></div></label></li>
  <li class="application-question"><label><div class="application-label">Current company</div><div class="application-field"><input type="text" name="org"></div></label></li>
  <li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
  <li class="application-question"><label><div class="application-label">GitHub URL</div><div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
  <li class="application-question custom-question"><label><div class="application-label">What is your notice period?<span class="required">✱</span></div><div class="application-field"><input type="text" name="cards[7a1b][field0]" required></div></label></li>
  <li class="application-question"><label><div class="application-label">Additional information</div><div class="application-field"><textarea name="comments"></textarea></div></label></li>
  <li class="application-question eeo"><label><div class="application-label">Gender</div><select name="eeo[gender]"><option value="">Select ...</option><option value="Male">Male</option><option value="Female">Female</option><option value="Decline to self-identify">Decline to self-identify</option></select></label></li>
  </ul>
  <button type="submit" class="template-btn-submit" id="btn-submit">Submit application</button>
</form></body></html>
